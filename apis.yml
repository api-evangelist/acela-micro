aid: acela-micro
name: Acela Micro
description: >-
  Acela Micro (Suzhou Acela Microelectronics, founded 2013) is a Chinese fabless
  semiconductor company designing high-end signal chain integrated circuits — ultra-high-speed
  and high-precision analog-to-digital converters (ADC), digital-to-analog converters (DAC),
  high-speed clock and wideband signal conditioning chips, and RF agile transceivers — plus
  system-level validation platforms such as the AUV1302 wideband real-time validation board.
  Its parts target 5G base stations, optical communications, test and measurement instrumentation,
  high-speed data acquisition, broadband radar, security imaging and medical devices, and the
  company positions itself around the domestic localization of high-performance data converters.
  Headquartered in Suzhou Industrial Park with branches in Beijing, Chengdu, Wuhan and Shenzhen,
  it holds 90+ invention patents across 80+ product families. The company sells silicon, datasheets
  and reference hardware; it operates no developer program, publishes no public API, SDK or
  machine-readable contract, and its Service and Support area distributes product manuals as PDFs.
